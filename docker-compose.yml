# PrernaNode — full local/production stack. Bring it up with:
#   docker compose up --build
#
# Server config comes from server/.env (copy server/.env.example first). Nothing here
# hardcodes secrets — MONGO_URI in server/.env should point at the `mongo` service name
# below, e.g. MONGO_URI=mongodb://mongo:27017/prernanode
#
# For a managed-Mongo deployment (Atlas, Render, Railway) just point MONGO_URI at that
# instead and drop the `mongo` service — server/client still work unchanged.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prernanode

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - server_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - prernanode

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - prernanode

volumes:
  mongo_data:
  server_logs:

networks:
  prernanode:
    driver: bridge
